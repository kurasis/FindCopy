name: Validate FindCopy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425
      - name: Build all projects
        run: dotnet build FindCopy.sln -c Release -m:2
      - name: Baseline correctness suite
        run: dotnet run -c Release --no-build --project tests/FindCopy.Tests
      - name: Acceptance regressions and large sparse-file cancellation
        run: dotnet run -c Release --no-build --project tests/FindCopy.Audit
      - name: WPF interaction and recovery reporting
        if: runner.os == 'Windows'
        run: dotnet run -c Release --no-build --project tests/FindCopy.UiTests -- ui-test-artifacts
      - name: Hardware acceptance wrapper smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dataset = Join-Path $env:RUNNER_TEMP 'FindCopy wrapper data'
          $work = Join-Path $env:RUNNER_TEMP 'FindCopy wrapper results'
          New-Item -ItemType Directory -Path $dataset | Out-Null
          1..4 | ForEach-Object { [IO.File]::WriteAllText((Join-Path $dataset "file-$_.txt"), 'wrapper smoke') }
          ./tools/run-hardware-acceptance.ps1 -Scenario E -Dataset $dataset -Work $work -Label 'Wrapper validation; not HDD acceptance' -OsCacheState unspecified
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: FindCopy-ui-validation
          path: ui-test-artifacts
      - name: Publish Windows desktop application
        if: runner.os == 'Windows'
        run: dotnet publish src/FindCopy.App -c Release --no-restore -o publish
      - name: Published desktop and WPF under a standard account
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/test-standard-user.ps1 -PublishedExe publish/FindCopy.exe -UiRunner tests/FindCopy.UiTests/bin/Release/net8.0-windows10.0.17763.0/win-x64/FindCopy.UiTests.exe -OutputDirectory standard-ui-artifacts
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: FindCopy-standard-user-validation
          path: standard-ui-artifacts
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: FindCopy-windows-x64
          path: publish/FindCopy.exe
